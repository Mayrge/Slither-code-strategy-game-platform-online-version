<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake Arena · 联网竞技台</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<div id="auth-screen" class="auth-screen">
  <section class="auth-brand"><div class="brand-mark">S</div><p class="eyebrow">SNAKE ARENA / ONLINE</p><h1>让代码<br>走出自己的路。</h1><p>30 × 30 棋盘 · 500 回合 · 多人策略竞技</p><div class="auth-board" aria-hidden="true"><span>↳</span><span>◆</span><span>↰</span></div><p class="muted">邀请码内测 · 策略私有 · 服务器统一裁判</p></section>
  <section class="auth-card"><p class="eyebrow">欢迎来到竞技台</p><h2 id="auth-title">登录账户</h2><form id="auth-form"><label>用户名<input id="auth-username" autocomplete="username" minlength="3" maxlength="24" required placeholder="字母、数字或下划线"></label><label>密码<input id="auth-password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required placeholder="至少 12 个字符"></label><div id="register-fields" hidden><label>邀请码<input id="auth-invite" maxlength="40" placeholder="向管理员获取邀请码"></label><label class="checkline"><input id="auth-consent" type="checkbox">我已知晓：策略对其他普通账户保密，管理员可查看代码以审核和管理。</label></div><p id="auth-error" class="error" role="alert"></p><button id="auth-submit" class="primary" type="submit">进入竞技台 →</button></form><button id="auth-switch" class="link" type="button">有邀请码？注册账户</button><p class="muted small">仅向受邀账户开放。请勿将密码或邀请码公开。</p></section>
</div>
<div id="app" hidden>
  <aside class="sidebar"><a class="brand" href="#ranking"><span class="brand-mark">S</span><span>Snake Arena<small>联网竞技台</small></span></a><div class="version">v0.1.1 · 邀请内测</div><nav id="nav"><button data-page="ranking" class="active">排行榜<span>01</span></button><button data-page="play">开始游戏<span>02</span></button><button data-page="strategies">策略<span>03</span></button><button data-page="matches">排位与战绩<span>04</span></button><button data-page="practice">自由赛程<span>05</span></button><button data-page="rules">规则与资料<span>06</span></button><button data-page="messages">交流留言<span>07</span></button><button data-page="account">账户设置<span>08</span></button><button data-page="admin" id="admin-nav" hidden>平台管理<span>↗</span></button></nav><div class="sidebar-bottom"><span class="status-dot"></span><div><strong id="sidebar-user"></strong><small id="sidebar-role"></small></div></div></aside>
  <main><header><div><p class="eyebrow">SNAKE ARENA / ONLINE</p><h1 id="page-title">排行榜</h1></div><div class="header-actions"><span class="pill">30 × 30</span><span class="pill">500 回合</span><span class="pill">自碰免死</span></div></header><div id="notice" role="status" hidden></div><div id="page"></div></main>
</div>
<dialog id="source-dialog"><div class="dialog-title"><h2>策略代码</h2><button id="close-source" aria-label="关闭策略窗口">×</button></div><p id="source-caption" class="muted"></p><textarea id="source-text" readonly spellcheck="false"></textarea><button id="copy-source" class="primary">复制代码</button></dialog>
<script type="module" src="/app.js"></script>
</body></html>
